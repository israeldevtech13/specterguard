<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpecterGuard | Detector Inteligente de Fraudes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Efeito de partículas dinâmicas */
        body::before {
            content: '';
            position: fixed;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(255,255,255,0.05) 1px, transparent 1px),
                radial-gradient(circle at 80% 30%, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            top: 0;
            left: 0;
            z-index: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Glassmorphism Header */
        header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        header:hover {
            transform: translateY(-5px);
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .logo i {
            font-size: 50px;
            color: #ff6b6b;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        header h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #fff 0%, #a8c0ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1em;
            margin-top: 10px;
        }

        /* Card Principal */
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 35px;
            margin-bottom: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 12px;
            font-size: 0.95em;
        }

        .input-group label i {
            color: #667eea;
            font-size: 1.2em;
        }

        textarea, input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e1e8ed;
            border-radius: 15px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            background: white;
        }

        textarea:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        /* Botão Principal */
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 30px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-primary:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        /* Resultado Animado */
        .resultado {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 30px;
            margin-bottom: 25px;
            animation: slideIn 0.5s ease-out;
            position: relative;
            overflow: hidden;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .resultado::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            transition: all 0.3s ease;
        }

        .resultado.risco-alto::before {
            background: linear-gradient(180deg, #ff6b6b, #c92a2a);
        }

        .resultado.risco-medio::before {
            background: linear-gradient(180deg, #ffa94d, #f76707);
        }

        .resultado.risco-baixo::before {
            background: linear-gradient(180deg, #69db7e, #2b8a3e);
        }

        .score-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.85em;
            margin-bottom: 15px;
        }

        .evidencias-list {
            list-style: none;
            margin-top: 20px;
        }

        .evidencias-list li {
            padding: 12px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9em;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Botões de Exemplo */
        .exemplos-grid {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .btn-exemplo {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #2c3e50;
        }

        .btn-exemplo:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        /* Stats Card */
        .stats-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            color: white;
        }

        .stats-card h3 {
            font-size: 1.1em;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .stats-number {
            font-size: 3em;
            font-weight: 800;
            animation: countUp 0.5s ease-out;
        }

        @keyframes countUp {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Loader Animation */
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .card, .resultado {
                padding: 20px;
            }
            
            header h1 {
                font-size: 1.8em;
            }
            
            .exemplos-grid {
                flex-direction: column;
            }
            
            .btn-exemplo {
                width: 100%;
                justify-content: center;
            }
        }

        /* Scrollbar Personalizada */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header Moderno -->
    <header>
        <div class="logo">
            <i class="fas fa-shield-haltered"></i>
            <h1>SpecterGuard</h1>
        </div>
        <p><i class="fas fa-robot"></i> IA de detecção de fraudes em tempo real | Proteção inteligente contra golpes digitais</p>
    </header>

    <!-- Card Principal de Input -->
    <div class="card">
        <div class="input-group">
            <label><i class="fas fa-file-alt"></i> Texto do anúncio</label>
            <textarea id="anuncio" placeholder="Cole aqui o anúncio suspeito...&#10;Ex: 🚨 URGENTE! Ganhe R$ 500 por dia no Kwai! Código: 123456"></textarea>
        </div>

        <div class="input-group">
            <label><i class="fas fa-link"></i> Link suspeito <span style="font-weight: normal; font-size: 0.8em; color: #888;">(opcional)</span></label>
            <input type="text" id="link" placeholder="https://...">
        </div>

        <div class="input-group">
            <label><i class="fab fa-whatsapp"></i> Número do WhatsApp <span style="font-weight: normal; font-size: 0.8em; color: #888;">(opcional)</span></label>
            <input type="text" id="whatsapp" placeholder="(11) 91234-5678">
        </div>

        <button class="btn-primary" id="analisarBtn">
            <i class="fas fa-microchip"></i>
            <span>Analisar com SpecterGuard</span>
            <i class="fas fa-arrow-right"></i>
        </button>
    </div>

    <!-- Resultado Dinâmico -->
    <div id="resultado" class="resultado hidden"></div>

    <!-- Exemplos Rápidos -->
    <div class="card">
        <label><i class="fas fa-flask"></i> Testar com exemplos</label>
        <div class="exemplos-grid">
            <button class="btn-exemplo" onclick="carregarExemplo(1)">
                <i class="fas fa-exclamation-triangle"></i> Golpe Kwai
            </button>
            <button class="btn-exemplo" onclick="carregarExemplo(2)">
                <i class="fas fa-gift"></i> Falso Prêmio
            </button>
            <button class="btn-exemplo" onclick="carregarExemplo(3)">
                <i class="fas fa-check-circle"></i> Anúncio Legítimo
            </button>
        </div>
    </div>

    <!-- Estatísticas -->
    <div class="stats-card">
        <h3><i class="fas fa-chart-line"></i> Ameaças neutralizadas</h3>
        <div class="stats-number" id="totalGolpes">0</div>
        <p style="font-size: 0.85em; margin-top: 10px; opacity: 0.8;">Desde que você começou a usar o SpecterGuard</p>
    </div>
</div>

<script>
    // SpecterGuard - Versão Moderna e Dinâmica
    
    // Inicializar estatísticas
    function carregarEstatisticas() {
        let total = localStorage.getItem('specterGuardTotal');
        if (!total) {
            localStorage.setItem('specterGuardTotal', '0');
            total = '0';
        }
        document.getElementById('totalGolpes').textContent = total;
        animarNumero(total);
    }
    
    function animarNumero(valor) {
        const elemento = document.getElementById('totalGolpes');
        elemento.style.animation = 'none';
        elemento.offsetHeight; // Forçar reflow
        elemento.style.animation = 'countUp 0.5s ease-out';
    }
    
    function salvarGolpe() {
        let total = parseInt(localStorage.getItem('specterGuardTotal')) + 1;
        localStorage.setItem('specterGuardTotal', total);
        document.getElementById('totalGolpes').textContent = total;
        animarNumero(total);
    }
    
    // Análise principal
    async function analisarAnuncio() {
        // Mostrar loading
        const btn = document.getElementById('analisarBtn');
        const btnOriginalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Analisando...';
        btn.disabled = true;
        
        // Simular processamento (para efeito visual)
        await new Promise(resolve => setTimeout(resolve, 500));
        
        const texto = document.getElementById('anuncio').value.trim();
        const link = document.getElementById('link').value.trim();
        const whatsapp = document.getElementById('whatsapp').value.trim();
        
        if (!texto) {
            alert('👻 Cole o texto do anúncio para análise!');
            btn.innerHTML = btnOriginalText;
            btn.disabled = false;
            return;
        }
        
        let score = 0;
        let evidencias = [];
        const textoLower = texto.toLowerCase();
        
        // Análise financeira
        if (/r\$\s*\d+/.test(textoLower)) {
            score += 3;
            evidencias.push({ icon: '💰', text: 'Promessa de valor monetário específico' });
        }
        if (/por dia|por hora|por semana/.test(textoLower)) {
            score += 3;
            evidencias.push({ icon: '⏰', text: 'Promessa de ganho por período' });
        }
        if (/renda extra|renda passiva|fácil|rápido/.test(textoLower)) {
            score += 3;
            evidencias.push({ icon: '💸', text: 'Promessa de renda fácil/rápida' });
        }
        
        // Urgência
        if (/urgente|agora|já|imediatamente|corre/.test(textoLower)) {
            score += 2;
            evidencias.push({ icon: '⚠️', text: 'Gatilho de urgência detectado' });
        }
        if (/últimas|limitado|exclusivo|acabando/.test(textoLower)) {
            score += 2;
            evidencias.push({ icon: '⏳', text: 'Falsa sensação de escassez' });
        }
        
        // Golpes Kwai
        if (/código|code|convite/.test(textoLower) && /\d{6,}/.test(texto)) {
            score += 8;
            evidencias.push({ icon: '🚨', text: 'PEDIDO DE CÓDIGO NUMÉRICO - GOLPE CRÍTICO' });
        }
        if (/kwai|kuaishou/.test(textoLower) && /código|convite/.test(textoLower)) {
            score += 6;
            evidencias.push({ icon: '📱', text: 'Padrão clássico de golpe do Kwai' });
        }
        
        // Palavras bloqueadas
        const bloqueadas = ['tigrinho', 'fortune tiger', 'betano', 'aposta', 'cassino', 'criptomoeda', 'bitcoin', 'pirâmide', 'fiz 5000'];
        for (let palavra of bloqueadas) {
            if (textoLower.includes(palavra)) {
                score += 5;
                evidencias.push({ icon: '🔞', text: `Palavra bloqueada: "${palavra}"` });
                break;
            }
        }
        
        // Link
        if (link) {
            const encurtadores = ['bit.ly', 'tinyurl.com', 'goo.gl', 'ow.ly', 'shorturl.at', 'is.gd', 'cutt.ly'];
            if (encurtadores.some(e => link.includes(e))) {
                score += 4;
                evidencias.push({ icon: '🔗', text: 'Link encurtado detectado (comum em golpes)' });
            }
            if (link.includes('kwai') && !link.includes('kwai.com')) {
                score += 6;
                evidencias.push({ icon: '🎭', text: 'DOMÍNIO FALSO imitando Kwai' });
            }
        }
        
        // WhatsApp
        if (whatsapp) {
            const numeros = whatsapp.replace(/\D/g, '');
            if (numeros.length >= 10) {
                const ddd = numeros.substring(0, 2);
                const dddsSuspeitos = ['11', '21', '61', '31', '41'];
                if (dddsSuspeitos.includes(ddd)) {
                    score += 2;
                    evidencias.push({ icon: '📞', text: `WhatsApp com DDD ${ddd} (comum em golpes)` });
                }
            }
        }
        
        // Combinação perigosa
        const temWhats = /whatsapp|zap|whats/.test(textoLower) || whatsapp;
        const temLinkEncurtado = link && ['bit.ly', 'tinyurl.com', 'goo.gl', 'ow.ly', 'shorturl.at'].some(e => link.includes(e));
        if (temWhats && temLinkEncurtado) {
            score += 3;
            evidencias.push({ icon: '🔥', text: 'Combinação perigosa: WhatsApp + link encurtado' });
        }
        
        // Determinar risco
        let risco, cor, recomendacao, emoji;
        if (score >= 8) {
            risco = 'ALTO';
            cor = 'risco-alto';
            recomendacao = '🚨 GOLPE CONFIRMADO! Não clique, não compartilhe, não envie dinheiro. Denuncie o anúncio imediatamente.';
            emoji = '🔴';
            salvarGolpe();
        } else if (score >= 4) {
            risco = 'MÉDIO';
            cor = 'risco-medio';
            recomendacao = '⚠️ ALTAMENTE SUSPEITO! Verifique fontes oficiais antes de qualquer ação. Desconfie de promessas milagrosas.';
            emoji = '🟡';
        } else {
            risco = 'BAIXO';
            cor = 'risco-baixo';
            recomendacao = '✅ Parece legítimo, mas mantenha a atenção. Sempre verifique URLs e fontes oficiais.';
            emoji = '🟢';
        }
        
        // Exibir resultado com animação
        const resultadoDiv = document.getElementById('resultado');
        resultadoDiv.className = `resultado ${cor}`;
        resultadoDiv.classList.remove('hidden');
        
        let evidenciasHtml = '';
        if (evidencias.length > 0) {
            evidenciasHtml = '<h4><i class="fas fa-flag-checkered"></i> Evidências encontradas:</h4><ul class="evidencias-list">';
            for (let e of evidencias) {
                evidenciasHtml += `<li><i class="fas fa-exclamation-circle" style="color: #ff6b6b;"></i> ${e.icon} ${e.text}</li>`;
            }
            evidenciasHtml += '</ul>';
        } else {
            evidenciasHtml = '<p style="text-align: center;"><i class="fas fa-check-circle" style="color: #28a745;"></i> Nenhum padrão suspeito detectado.</p>';
        }
        
        resultadoDiv.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="display: flex; align-items: center; gap: 10px;">
                    <span style="font-size: 2em;">${emoji}</span>
                    Análise Completa
                </h3>
                <div class="score-badge" style="background: ${cor === 'risco-alto' ? '#ff6b6b20' : cor === 'risco-medio' ? '#ffa94d20' : '#69db7e20'}">
                    <i class="fas fa-chart-simple"></i> Score: ${score}/20
                </div>
            </div>
            <div style="margin-bottom: 20px;">
                <span style="font-weight: 700;">Nível de risco:</span>
                <span style="font-weight: 800; color: ${cor === 'risco-alto' ? '#c92a2a' : cor === 'risco-medio' ? '#f76707' : '#2b8a3e'}"> ${risco}</span>
            </div>
            ${evidenciasHtml}
            <div style="margin-top: 20px; padding: 15px; background: linear-gradient(135deg, #f8f9fa, #e9ecef); border-radius: 15px;">
                <i class="fas fa-lightbulb" style="color: #ffa94d;"></i>
                <strong style="margin-left: 8px;">Recomendação:</strong>
                <p style="margin-top: 8px; font-size: 0.9em;">${recomendacao}</p>
            </div>
        `;
        
        resultadoDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        
        // Restaurar botão
        btn.innerHTML = btnOriginalText;
        btn.disabled = false;
    }
    
    // Carregar exemplos
    function carregarExemplo(tipo) {
        const exemplos = {
            1: {
                texto: "🚨 URGENTE! Ganhe R$ 500 por dia no Kwai! Código de convite: 123456789. Chama no zap: (11) 91234-5678",
                link: "bit.ly/ganhe-agora",
                whatsapp: "5511912345678"
            },
            2: {
                texto: "PARABÉNS! Você ganhou um iPhone 15! Clique aqui e pague apenas o frete de R$ 89,90. Últimas unidades!",
                link: "tinyurl.com/premio-iphone",
                whatsapp: ""
            },
            3: {
                texto: "Promoção válida: 20% off em toda loja. Confira nosso site oficial.",
                link: "https://www.lojaoficial.com.br/promocao",
                whatsapp: ""
            }
        };
        
        const ex = exemplos[tipo];
        if (ex) {
            document.getElementById('anuncio').value = ex.texto;
            document.getElementById('link').value = ex.link;
            document.getElementById('whatsapp').value = ex.whatsapp;
            // Scroll para o input
            document.getElementById('anuncio').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }
    
    // Event Listeners
    document.getElementById('analisarBtn').addEventListener('click', analisarAnuncio);
    
    // Enter para analisar (Ctrl+Enter no textarea)
    document.getElementById('anuncio').addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'Enter') {
            analisarAnuncio();
        }
    });
    
    // Inicializar
    carregarEstatisticas();
    console.log('👻 SpecterGuard v2.0 - Modo moderno ativado!');
</script>

</body>
</html>
