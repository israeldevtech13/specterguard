<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpecterGuard - Detecte anúncios fraudulentos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        header {
            background: #16213e;
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        header p {
            opacity: 0.9;
            font-size: 0.9em;
        }

        .input-section {
            padding: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            margin-top: 20px;
        }

        label:first-of-type {
            margin-top: 0;
        }

        textarea, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }

        textarea:focus, input:focus {
            outline: none;
            border-color: #16213e;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button {
            background: #16213e;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            width: 100%;
        }

        button:hover {
            background: #0f3460;
        }

        .resultado {
            margin: 0 30px 30px 30px;
            padding: 20px;
            border-radius: 15px;
        }

        .risco-alto {
            background: #ffe6e6;
            border-left: 5px solid #ff0000;
        }

        .risco-medio {
            background: #fff3cd;
            border-left: 5px solid #ff9800;
        }

        .risco-baixo {
            background: #d4edda;
            border-left: 5px solid #28a745;
        }

        .resultado h3 {
            margin-bottom: 15px;
        }

        .resultado .score {
            font-size: 1.3em;
            font-weight: bold;
            margin: 10px 0;
        }

        .resultado ul {
            margin-top: 15px;
            padding-left: 20px;
        }

        .resultado li {
            margin: 8px 0;
        }

        .exemplos {
            padding: 0 30px 30px 30px;
        }

        .exemplos h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .exemplo-btn {
            background: #e0e0e0;
            color: #333;
            margin-right: 10px;
            margin-top: 10px;
            width: auto;
            display: inline-block;
            padding: 8px 16px;
            font-size: 14px;
        }

        .exemplo-btn:hover {
            background: #ccc;
        }

        .stats {
            padding: 20px 30px 30px 30px;
            border-top: 2px solid #eee;
            background: #f9f9f9;
        }

        .stats h3 {
            margin-bottom: 10px;
            color: #555;
        }

        #totalGolpes {
            font-size: 1.5em;
            color: #ff0000;
        }

        .hidden {
            display: none;
        }

        .recomendacao {
            margin-top: 20px;
            padding: 10px;
            background: rgba(0,0,0,0.05);
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>👻 SpecterGuard</h1>
        <p>Proteja-se contra anúncios falsos do Kwai, links suspeitos e números fraudulentos</p>
    </header>

    <div class="input-section">
        <label>📝 Cole o texto do anúncio:</label>
        <textarea id="anuncio" rows="5" placeholder="Ex: 🚨 URGENTE! Ganhe R$ 500 por dia no Kwai! Código: 123456..."></textarea>

        <label>🔗 Link suspeito (opcional):</label>
        <input type="text" id="link" placeholder="https://bit.ly/exemplo">

        <label>📱 WhatsApp (opcional):</label>
        <input type="text" id="whatsapp" placeholder="(11) 91234-5678">

        <button onclick="analisarAnuncio()">🔍 Analisar com SpecterGuard</button>
    </div>

    <div id="resultado" class="resultado hidden"></div>

    <div class="exemplos">
        <h3>📋 Teste com exemplos:</h3>
        <button class="exemplo-btn" onclick="carregarExemplo(1)">Golpe Kwai</button>
        <button class="exemplo-btn" onclick="carregarExemplo(2)">Falso Prêmio</button>
        <button class="exemplo-btn" onclick="carregarExemplo(3)">Anúncio Ok</button>
    </div>

    <div class="stats">
        <h3>📊 SpecterGuard em ação:</h3>
        <p>🛡️ Ameaças neutralizadas: <strong id="totalGolpes">0</strong></p>
    </div>
</div>

<script>
    // SpecterGuard - Versão Corrigida
    
    // Carregar estatísticas ao iniciar
    function carregarEstatisticas() {
        let total = localStorage.getItem('specterGuardTotal');
        if (total === null) {
            localStorage.setItem('specterGuardTotal', '0');
            total = '0';
        }
        document.getElementById('totalGolpes').innerText = total;
    }
    
    // Salvar estatísticas
    function salvarGolpe() {
        let total = parseInt(localStorage.getItem('specterGuardTotal'));
        total = total + 1;
        localStorage.setItem('specterGuardTotal', total);
        document.getElementById('totalGolpes').innerText = total;
    }
    
    // Função principal de análise
    function analisarAnuncio() {
        // Pegar os valores
        let texto = document.getElementById('anuncio').value;
        let link = document.getElementById('link').value;
        let whatsapp = document.getElementById('whatsapp').value;
        
        // Validar se tem texto
        if (texto === "") {
            alert("Por favor, cole o texto do anúncio para análise.");
            return;
        }
        
        let score = 0;
        let evidencias = [];
        
        // Converter para minúsculo para facilitar
        let textoLower = texto.toLowerCase();
        
        // 1. Verificar promessas financeiras
        if (textoLower.match(/r\$|ganhe|renda|pix|dinheiro|pagar|depósito/i)) {
            if (textoLower.match(/r\$\s*\d+/)) {
                score += 3;
                evidencias.push("Promessa de valor monetário específico");
            }
            if (textoLower.match(/por dia|por hora|por semana/)) {
                score += 3;
                evidencias.push("Promessa de ganho por período");
            }
            if (textoLower.match(/renda extra|renda passiva|fácil|rápido/)) {
                score += 3;
                evidencias.push("Promessa de renda fácil/rápida");
            }
        }
        
        // 2. Verificar urgencia
        if (textoLower.match(/urgente|agora|já|imediatamente|corre|rápido/)) {
            score += 2;
            evidencias.push("Gatilho de urgência detectado");
        }
        
        if (textoLower.match(/últimas|limitado|exclusivo|acabando|esgotando/)) {
            score += 2;
            evidencias.push("Falsa sensação de escassez");
        }
        
        // 3. Golpes específicos do Kwai
        if (textoLower.match(/código|code|convite/)) {
            if (texto.match(/\d{6,}/)) {
                score += 8;
                evidencias.push("🚨 PEDIDO DE CÓDIGO NUMÉRICO - GOLPE CRÍTICO");
            }
        }
        
        if (textoLower.match(/kwai|kuaishou/)) {
            score += 2;
            evidencias.push("Menção à plataforma Kwai");
            
            if (textoLower.match(/código|code|convite|seguir|curtir|compartilhar/)) {
                score += 4;
                evidencias.push("Padrão de golpe do Kwai detectado");
            }
        }
        
        // 4. Verificar palavras bloqueadas
        let palavrasBloqueadas = ['tigrinho', 'fortune tiger', 'betano', 'aposta', 'cassino', 'criptomoeda', 'bitcoin', 'pirâmide'];
        for (let i = 0; i < palavrasBloqueadas.length; i++) {
            if (textoLower.indexOf(palavrasBloqueadas[i]) !== -1) {
                score += 5;
                evidencias.push("🚨 Palavra bloqueada: " + palavrasBloqueadas[i]);
                break;
            }
        }
        
        // 5. Analisar link
        if (link !== "") {
            let encurtadores = ['bit.ly', 'tinyurl.com', 'goo.gl', 'ow.ly', 'shorturl.at', 'is.gd', 'cutt.ly'];
            let isEncurtado = false;
            
            for (let i = 0; i < encurtadores.length; i++) {
                if (link.indexOf(encurtadores[i]) !== -1) {
                    isEncurtado = true;
                    break;
                }
            }
            
            if (isEncurtado) {
                score += 4;
                evidencias.push("Link encurtado detectado (comum em golpes)");
            }
            
            if (link.indexOf('kwai') !== -1 && link.indexOf('kwai.com') === -1) {
                score += 6;
                evidencias.push("🚨 DOMÍNIO FALSO imitando Kwai");
            }
        }
        
        // 6. Analisar WhatsApp
        if (whatsapp !== "") {
            let numeros = whatsapp.replace(/\D/g, '');
            if (numeros.length >= 10) {
                let ddd = numeros.substring(0, 2);
                let dddsSuspeitos = ['11', '21', '61', '31', '41'];
                
                for (let i = 0; i < dddsSuspeitos.length; i++) {
                    if (ddd === dddsSuspeitos[i]) {
                        score += 2;
                        evidencias.push("WhatsApp com DDD " + ddd + " (comum em golpes)");
                        break;
                    }
                }
            }
        }
        
        // 7. Combinação perigosa
        let temWhats = (textoLower.indexOf('whatsapp') !== -1 || textoLower.indexOf('zap') !== -1 || whatsapp !== "");
        let temLinkEncurtado = false;
        
        if (link !== "") {
            let encurtadores = ['bit.ly', 'tinyurl.com', 'goo.gl', 'ow.ly', 'shorturl.at'];
            for (let i = 0; i < encurtadores.length; i++) {
                if (link.indexOf(encurtadores[i]) !== -1) {
                    temLinkEncurtado = true;
                    break;
                }
            }
        }
        
        if (temWhats && temLinkEncurtado) {
            score += 3;
            evidencias.push("🔴 Combinação perigosa: WhatsApp + link encurtado");
        }
        
        // Determinar resultado
        let risco = "";
        let cor = "";
        let recomendacao = "";
        
        if (score >= 8) {
            risco = "ALTO";
            cor = "risco-alto";
            recomendacao = "🚨 GOLPE CONFIRMADO! Não clique, não compartilhe, não envie dinheiro. Denuncie o anúncio.";
            salvarGolpe();
        } else if (score >= 4) {
            risco = "MÉDIO";
            cor = "risco-medio";
            recomendacao = "⚠️ ALTAMENTE SUSPEITO! Desconfie. Verifique fontes oficiais antes de qualquer ação.";
        } else {
            risco = "BAIXO";
            cor = "risco-baixo";
            recomendacao = "✅ Parece legítimo, mas mantenha a atenção. Sempre verifique fontes oficiais.";
        }
        
        // Montar HTML do resultado
        let evidenciasHtml = "";
        if (evidencias.length > 0) {
            evidenciasHtml = "<h4>🚩 Evidências encontradas:</h4><ul>";
            for (let i = 0; i < evidencias.length; i++) {
                evidenciasHtml += "<li>⚠️ " + evidencias[i] + "</li>";
            }
            evidenciasHtml += "</ul>";
        } else {
            evidenciasHtml = "<p>✅ Nenhum padrão suspeito detectado.</p>";
        }
        
        let resultadoDiv = document.getElementById('resultado');
        resultadoDiv.className = "resultado " + cor;
        resultadoDiv.classList.remove('hidden');
        
        let emoji = "";
        if (score >= 8) emoji = "🔴";
        else if (score >= 4) emoji = "🟡";
        else emoji = "🟢";
        
        resultadoDiv.innerHTML = `
            <h3>${emoji} Resultado da Análise</h3>
            <div class="score">Nível de risco: ${risco}</div>
            <div>Pontuação: ${score}/20</div>
            ${evidenciasHtml}
            <div class="recomendacao">
                <strong>💡 Recomendação:</strong> ${recomendacao}
            </div>
        `;
        
        // Scroll para o resultado
        resultadoDiv.scrollIntoView({ behavior: 'smooth' });
    }
    
    // Função para carregar exemplos
    function carregarExemplo(tipo) {
        if (tipo === 1) {
            document.getElementById('anuncio').value = "🚨 URGENTE! Ganhe R$ 500 por dia no Kwai! Código de convite: 123456789. Chama no zap: (11) 91234-5678";
            document.getElementById('link').value = "bit.ly/ganhe-agora";
            document.getElementById('whatsapp').value = "5511912345678";
        } else if (tipo === 2) {
            document.getElementById('anuncio').value = "PARABÉNS! Você ganhou um iPhone 15! Clique aqui e pague apenas o frete de R$ 89,90. Últimas unidades!";
            document.getElementById('link').value = "tinyurl.com/premio-iphone";
            document.getElementById('whatsapp').value = "";
        } else if (tipo === 3) {
            document.getElementById('anuncio').value = "Promoção válida: 20% off em toda loja. Confira nosso site oficial.";
            document.getElementById('link').value = "https://www.lojaoficial.com.br/promocao";
            document.getElementById('whatsapp').value = "";
        }
    }
    
    // Inicializar ao carregar a página
    carregarEstatisticas();
    console.log("👻 SpecterGuard pronto para uso!");
</script>

</body>
</html>
